<section class="dst-cta">

    <h2>Et si nous simplifions ensemble votre quotidien ?</h2>
    <p>Découvrez nos solutions digitales dédiées aux professionnels de santé.</p>
    <div class="dst-cta__actions">
      <a routerLink="/solutions" class="dst-btn dst-btn-light">

      </a>
      <a routerLink="/contact" class="dst-btn dst-btn-outline-light">Nous contacter</a>
    </div>
  </div>
</section>
